# Wlasne reguly dostepu do zadan 1-3 wpisz ponizej.
<Directory "/usr/local/apache2/htdocs/materialy">
    Options -Indexes
</Directory>

<Directory "/usr/local/apache2/htdocs/wewnetrzne">
    Require all denied
</Directory>
# Sciezki Directory odnosza sie do systemu plikow kontenera.
<Directory "/usr/local/apache2/htdocs/panel">
    AuthType Basic
    AuthName "Laboratorium 5"
    AuthUserFile /auth/uzytkownicy
    Require valid-user
</Directory>
<Directory "/usr/local/apache2/cgi-bin">
    AuthType Basic
    AuthName "Laboratorium 5"
    AuthUserFile /auth/uzytkownicy
    Require valid-user
</Directory>